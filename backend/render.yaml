# Render Blueprint — one web service + a free Postgres database.
# New → Blueprint → select this repo. Fill secret vars in the dashboard.
services:
  - type: web
    name: campus-companion-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campus-companion-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GMAIL_KEYWORDS
        value: feedback,evaluation,survey,deadline,course review

databases:
  - name: campus-companion-db
    plan: free
