# Render Blueprint — one web service + a free Postgres database.
# Must live at the REPO ROOT for Render to auto-detect it.
# Deploy: Render Dashboard → New → Blueprint → select this repo.
# Then fill the secret vars (GOOGLE_*) in the dashboard.
services:
  - type: web
    name: campus-companion-api
    runtime: node
    plan: free
    rootDir: backend # build/run from the backend/ subfolder
    # --include=dev forces devDependencies (typescript, prisma) to install even
    # though NODE_ENV=production would otherwise skip them → tsc/prisma not found.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campus-companion-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render generates a strong secret
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: GOOGLE_CLIENT_ID
        sync: false # set manually in dashboard (secret)
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GMAIL_KEYWORDS
        value: feedback,evaluation,survey,deadline,course review
      - key: GMAIL_SEARCH_SCOPE
        value: subject

databases:
  - name: campus-companion-db
    plan: free
